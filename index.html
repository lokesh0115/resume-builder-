<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Resume Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef0f3;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#d7dce3;--pri:#1f4e79;--pt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--card:#1d2128;--tx:#e7e9ee;--mu:#98a1b0;--bd:#303641;--pri:#6aa6dd;--pt:#0d1117}}
:root[data-theme="dark"]{--bg:#13161b;--card:#1d2128;--tx:#e7e9ee;--mu:#98a1b0;--bd:#303641;--pri:#6aa6dd;--pt:#0d1117}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.bar h1{margin:0;font-size:17px}
.tabs{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:none;color:var(--tx);padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--pt)}
.app{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:1280px;margin:0 auto}
.prev{display:none}
body.pv .prev{display:block}
body.pv .edit{display:none}
@media(min-width:900px){.app{grid-template-columns:400px 1fr;align-items:start}.tabs{display:none}.prev,.edit{display:block!important}}
.edit{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 14px 16px}
.edit h2{font-size:14px;margin:18px 0 8px}
.edit h2 small{color:var(--mu);font-weight:400}
input,textarea,select{width:100%;margin:0 0 8px;padding:10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
textarea{resize:vertical}
.item{border-left:3px solid var(--pri);padding-left:10px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.add,.x,.sec{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:7px;padding:7px 12px;margin:0 6px 6px 0}
.x{color:var(--mu);font-size:13px;padding:4px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.row input[type=color]{width:52px;height:42px;padding:2px;margin:0}
.row select{flex:1;margin:0}
.pri{background:var(--pri);color:var(--pt);border:0;border-radius:7px;padding:11px 16px;font-weight:600;flex:1}
#warn{font-size:13px;color:var(--mu);margin:0 0 8px;text-align:center}
#resume{background:#fff;color:#161616;max-width:794px;margin:0 auto;padding:22px;box-shadow:0 1px 10px rgba(0,0,0,.18);font:13px/1.45 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
#resume h1{margin:0;font-size:25px;line-height:1.15}
#resume .sub{margin:2px 0 0;font-size:14px}
#resume .ct{margin:6px 0 0;font-size:12px}
#resume h3{margin:14px 0 5px;font-size:13px;color:var(--a);border-bottom:1px solid #cfcfcf;padding-bottom:2px}
#resume .e{display:grid;grid-template-columns:1fr auto;gap:0 10px;margin-bottom:6px}
#resume .e div{grid-column:1/-1}
#resume .e span{font-size:12px;color:#555}
#resume ul{margin:0;padding-left:18px}
#resume p{margin:0}
.t-classic header{text-align:center;border-bottom:2px solid var(--a);padding-bottom:9px}
.t-classic .chip:not(:last-child)::after,.t-minimal .chip:not(:last-child)::after,.t-elegant .chip:not(:last-child)::after,.t-compact .chip:not(:last-child)::after{content:", "}
.t-modern{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t-modern header{background:var(--a);color:#fff;margin:-22px -22px 4px;padding:20px 22px}
.t-modern .chip{display:inline-block;background:#eef1f5;border-radius:4px;padding:2px 8px;margin:0 4px 4px 0}
.t-modern h3{border:0;border-left:4px solid var(--a);padding-left:8px}
#resume header.hp{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:14px;text-align:left}
#resume .ht{flex:1;min-width:0}
#resume .ph{width:84px;height:112px;object-fit:cover;border:1px solid #ccc;border-radius:4px;flex:none;background:#fff}
#resume.t-minimal{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#resume.t-minimal header{text-align:left;border:0;padding:0 0 4px}
#resume.t-minimal h1{color:var(--a);font-weight:600;font-size:26px}
#resume.t-minimal h3{border:0;color:var(--a);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 4px}
#resume.t-elegant header{text-align:center;border-top:1px solid var(--a);border-bottom:1px solid var(--a);padding:10px 0}
#resume.t-elegant h1{font-size:28px;letter-spacing:.05em;font-weight:400}
#resume.t-elegant h3{text-align:center;font-weight:400;font-size:15px;font-variant:small-caps;letter-spacing:.06em;border-bottom:1px solid #bbb}
#resume.t-compact{font-size:11.5px;line-height:1.35}
#resume.t-compact h1{font-size:21px}
#resume.t-compact header{border-bottom:2px solid var(--a);padding-bottom:5px}
#resume.t-compact h3{margin:9px 0 3px}
#resume.t-compact .e{margin-bottom:3px}
#resume.t-sidebar{padding:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.sb{display:grid;grid-template-columns:34% 1fr}
.sb aside{background:var(--a);color:#fff;padding:18px 14px}
.sb .mn{padding:20px}
#resume.t-sidebar aside h3{color:#fff;border-bottom:1px solid rgba(255,255,255,.45)}
#resume.t-sidebar aside p{font-size:12px;margin:0 0 3px}
#resume.t-sidebar .ph{width:100%;height:auto;aspect-ratio:3/4;border:2px solid #fff;margin-bottom:6px}
#resume.t-sidebar .chip{display:block}
#resume.t-sidebar .mn h3{border-bottom:2px solid var(--a)}
@page{size:A4;margin:12mm}
@media print{:root{padding:0}body{background:#fff}.no-print{display:none!important}.prev{display:block!important}.app{display:block;padding:0}
#resume{box-shadow:none;padding:0;max-width:none}
.t-modern header{margin:0 0 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.t-modern .chip,#resume aside{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar no-print"><h1>📄 Resume Builder</h1>
<div class="tabs"><button id="tE" class="on">Edit</button><button id="tP">Preview</button></div></div>
<main class="app">
<section class="edit no-print">
<h2>Basics</h2>
<input data-f="name" placeholder="Full name" autocomplete="name">
<input data-f="title" placeholder="Headline (e.g. B.E. CSE student)">
<input data-f="email" type="email" placeholder="Email" autocomplete="email">
<input data-f="phone" type="tel" placeholder="Phone" autocomplete="tel">
<input data-f="location" placeholder="City, State">
<input data-f="links" placeholder="GitHub / LinkedIn link">
<h2>Photo <small>optional</small></h2>
<div class="row"><input id="ph" type="file" accept="image/*"><button class="sec" id="phx" type="button">Remove photo</button></div>
<h2>Summary</h2>
<textarea data-f="summary" rows="3" placeholder="2-3 lines about you and what you're looking for"></textarea>
<h2>Skills <small>separate with commas</small></h2>
<input data-f="skills" placeholder="Java, SQL, HTML, CSS, Git">
<div id="lists"></div>
<h2>Hobbies and interests <small>separate with commas</small></h2>
<input data-f="hobbies" placeholder="Cricket, Football, Digital marketing">
<h2>Style</h2>
<div class="row"><select id="tpl"><option value="classic">Classic</option><option value="modern">Modern</option><option value="minimal">Minimal</option><option value="elegant">Elegant</option><option value="compact">Compact (fits more)</option><option value="sidebar">Sidebar</option></select>
<input id="acc" type="color" value="#1f4e79" aria-label="Accent color"></div>
<div class="row"><button class="pri" id="pdf">Save as PDF</button><button class="sec" id="rst">Reset</button></div>
</section>
<section class="prev">
<p id="warn" class="no-print"></p>
<article id="resume"></article>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const LISTS={
 education:[['school','School / College'],['degree','Degree'],['year','Year · CGPA']],
 internships:[['company','Company / Organization'],['role','Role'],['period','Duration (e.g. Jun-Jul 2026)'],['desc','What you did']],
 projects:[['name','Project name'],['tech','Tech used'],['desc','What it does']],
 certs:[['name','Certification']],
 activities:[['name','Activity / Club / Sport'],['role','Role or achievement'],['year','Year']]};
const TITLES={education:'Education',internships:'Internships',projects:'Projects',certs:'Certifications',activities:'Extra-curricular activities'};
const blank=()=>({name:'',title:'',email:'',phone:'',location:'',links:'',summary:'',skills:'',photo:'',hobbies:'',
 template:'classic',accent:'#1f4e79',education:[{}],internships:[{}],projects:[{}],certs:[{}],activities:[{}]});
let S=blank(),armed=false;
try{const d=JSON.parse(localStorage.getItem('rb'));if(d)S=Object.assign(blank(),d)}catch(e){}
const save=()=>{try{localStorage.setItem('rb',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderLists(){
 $('#lists').innerHTML=Object.keys(LISTS).map(k=>
  `<h2>${TITLES[k]}</h2>`+S[k].map((it,i)=>`<div class="item">`+LISTS[k].map(([f,p])=>{
   const a=`data-k="${k}" data-i="${i}" data-f="${f}" placeholder="${p}"`;
   return f==='desc'?`<textarea rows="2" ${a}>${esc(it[f])}</textarea>`:`<input ${a} value="${esc(it[f])}">`}).join('')+
   `<button class="x" data-del="${k}:${i}">Remove</button></div>`).join('')+
  `<button class="add" data-add="${k}">+ Add ${TITLES[k].toLowerCase()}</button>`).join('');
}
function fillForm(){
 document.querySelectorAll('[data-f]:not([data-k])').forEach(el=>el.value=S[el.dataset.f]||'');
 $('#tpl').value=S.template;$('#acc').value=S.accent;renderLists();
}
function render(){
 const r=$('#resume'),T=S.template;r.className='t-'+T;r.style.setProperty('--a',S.accent);
 const sec=(t,b)=>b?`<h3>${t}</h3>${b}`:'';
 const entry=(a,b,c)=>`<div class="e"><b>${esc(a)}</b><span>${esc(b)}</span>${c?`<div>${esc(c)}</div>`:''}</div>`;
 const chips=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
 const j=(...a)=>a.filter(Boolean).join(' · ');
 const edu=S.education.filter(x=>x.school||x.degree).map(x=>entry(x.school,x.year,x.degree)).join('');
 const intn=S.internships.filter(x=>x.company||x.role).map(x=>entry(j(x.company,x.role),x.period,x.desc)).join('');
 const pr=S.projects.filter(x=>x.name||x.desc).map(x=>entry(x.name,x.tech,x.desc)).join('');
 const act=S.activities.filter(x=>x.name||x.role).map(x=>entry(x.name,x.year,x.role)).join('');
 const ce=S.certs.filter(x=>x.name);
 const cert=ce.length?`<ul>${ce.map(x=>`<li>${esc(x.name)}</li>`).join('')}</ul>`:'';
 const sk=chips(S.skills),hb=chips(S.hobbies),name=esc(S.name)||'Your Name';
 const img=S.photo?`<img class="ph" src="${S.photo}" alt="Photo">`:'';
 const sum=S.summary?`<p>${esc(S.summary)}</p>`:'';
 if(T==='sidebar'){
  const cl=[S.email,S.phone,S.location,S.links].filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('');
  r.innerHTML=`<div class="sb"><aside>${img}${sec('Contact',cl)}${sec('Skills',sk)}${sec('Hobbies',hb)}${sec('Certifications',cert)}</aside><div class="mn"><h1>${name}</h1>${S.title?`<p class="sub">${esc(S.title)}</p>`:''}${sec('Summary',sum)}${sec('Education',edu)}${sec('Internships',intn)}${sec('Projects',pr)}${sec('Extra-curricular activities',act)}</div></div>`;
 }else{
  const contact=[S.email,S.phone,S.location,S.links].filter(Boolean).map(esc).join(' · ');
  r.innerHTML=`<header${S.photo?' class="hp"':''}>${img}<div class="ht"><h1>${name}</h1>${S.title?`<p class="sub">${esc(S.title)}</p>`:''}${contact?`<p class="ct">${contact}</p>`:''}</div></header>`+
   sec('Summary',sum)+sec('Education',edu)+sec('Skills',sk?`<p>${sk}</p>`:'')+sec('Internships',intn)+sec('Projects',pr)+sec('Certifications',cert)+sec('Extra-curricular activities',act)+sec('Hobbies and interests',hb?`<p>${hb}</p>`:'');
 }
 if(r.clientWidth){const long=r.scrollHeight/r.clientWidth>1.41;
  $('#warn').textContent=long?'⚠ Longer than one A4 page. Try the Compact template or trim content.':'✓ Fits on one A4 page';}
}
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(d.k)S[d.k][+d.i][d.f]=t.value;else if(d.f)S[d.f]=t.value;
 else if(t.id==='tpl')S.template=t.value;else if(t.id==='acc')S.accent=t.value;else return;
 save();render();});
document.addEventListener('click',e=>{
 const t=e.target,d=t.dataset;
 if(d.add){S[d.add].push({});renderLists();save();return}
 if(d.del){const[k,i]=d.del.split(':');S[k].splice(+i,1);if(!S[k].length)S[k].push({});renderLists();save();render();return}
 if(t.id==='tE'||t.id==='tP'){document.body.classList.toggle('pv',t.id==='tP');
  $('#tE').classList.toggle('on',t.id==='tE');$('#tP').classList.toggle('on',t.id==='tP');render();window.scrollTo(0,0)}
 if(t.id==='phx'){S.photo='';$('#ph').value='';save();render()}
 if(t.id==='pdf')window.print();
 if(t.id==='rst'){if(!armed){armed=true;t.textContent='Tap again to erase all';setTimeout(()=>{armed=false;t.textContent='Reset'},3000)}
  else{S=blank();save();fillForm();render();armed=false;t.textContent='Reset'}}
});
$('#ph').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const W=240,H=320,c=document.createElement('canvas');c.width=W;c.height=H;
  const k=Math.max(W/img.width,H/img.height),w=img.width*k,h=img.height*k;
  c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);
  S.photo=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);save();render();};
 img.src=u;});
fillForm();render();
</script>
</body>
</html>
